name: Build Game Boy ROM

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download GBDK-2020
        run: |
          wget -q https://github.com/gbdk-2020/gbdk-2020/releases/download/4.5.0/gbdk-linux64.tar.gz
          tar -xzf gbdk-linux64.tar.gz
          sudo mkdir -p /opt/gbdk
          sudo cp -a gbdk/* /opt/gbdk/

      - name: Add GBDK to PATH
        run: echo "/opt/gbdk/bin" >> "$GITHUB_PATH"

      - name: Check lcc
        run: |
          which lcc
          lcc -v
          ls -l /opt/gbdk/bin/sdcc

      - name: Build ROM
        run: make

      - name: Upload hero.gb
        uses: actions/upload-artifact@v4
        with:
          name: hero-gb
          path: hero.gb
